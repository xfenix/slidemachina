# Any push to main that touches the broker rebuilds the Cloudflare Worker.
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy the remote broker

on:
  push:
    branches: [main]
    paths:
      - remote-broker/**
      - .github/workflows/deploy-remote-broker.yml
  workflow_dispatch:

concurrency:
  group: deploy-remote-broker
  cancel-in-progress: true

# Until the secrets are set, the workflow skips instead of failing: the job if-guards read these.
env:
  cloudflareApiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  cloudflareAccountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cloudflare-worker:
    if: ${{ env.cloudflareApiToken != '' && env.cloudflareAccountId != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: remote-broker
