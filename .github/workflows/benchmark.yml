# Measures the same talk in the slidemachina of this commit, reveal.js, Slidev and open-slide from npm.
# The main picture goes to the benchmark branch; a pull request gets its own branch and a comment with the picture.
name: Benchmark

on:
  # A new slidemachina on npm: right after the publish workflow.
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]
  # New versions of the others: once a week.
  schedule:
    - cron: "0 6 * * 1"
  # The measured engine is this repository: every change to main is a new measurement.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Fork tokens cannot publish the picture or comment, so only same-repository PRs are measured.
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install
        run: npm ci

      - name: Measure
        run: node benchmark/run-benchmark.ts "$RUNNER_TEMP/benchmark-results"

      - name: Publish to the benchmark branch
        run: |
          cd "$RUNNER_TEMP/benchmark-results"
          resultBranch="benchmark"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then resultBranch="benchmark-pr-${{ github.event.pull_request.number }}"; fi
          git init --quiet --initial-branch "$resultBranch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Benchmark of $(date -u +%Y-%m-%d)"
          git push --force --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$resultBranch"

      # jsDelivr keeps a branch file for hours; the README should show the new picture now.
      - name: Refresh the jsDelivr copy
        if: github.event_name != 'pull_request'
        run: curl --fail --silent --show-error "https://purge.jsdelivr.net/gh/${{ github.repository }}@benchmark/benchmark.svg" > /dev/null

      - name: Put the picture into the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = "<!-- slidemachina-benchmark -->";
            const resultBranch = `benchmark-pr-${context.issue.number}`;
            const pictureAddress = `https://raw.githubusercontent.com/${owner}/${repo}/${resultBranch}/benchmark.svg?v=${context.sha}`;
            const body = `${marker}\n## Benchmark\n\n![Benchmark](${pictureAddress})\n\n[Results and methodology](https://github.com/${owner}/${repo}/blob/${resultBranch}/README.md)`;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: context.issue.number, per_page: 100 });
            const previousComment = comments.data.find((comment) => comment.body?.includes(marker));
            if (previousComment) await github.rest.issues.updateComment({ owner, repo, comment_id: previousComment.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
