# Every push to main that touches the examples or the engine rebuilds examples/ and puts it on GitHub Pages.
name: Publish the examples

on:
  push:
    branches: [main]
    paths:
      - examples/**
      - packages/slidemachina/**
      - package-lock.json
      - .github/workflows/publish-examples.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-examples
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install
        run: npm ci

      # The TURN credential is a repository secret: the published demos carry it, the source keeps a
      # placeholder. A missing secret keeps the placeholder — TURN auth fails and STUN alone carries on.
      - name: Put the TURN credential into the remote transport
        env:
          turnCredential: ${{ secrets.SLIDEMACHINA_TURN_CREDENTIAL }}
        run: |
          if [ -n "$turnCredential" ]; then
            sed -i "s/__SLIDEMACHINA_TURN_CREDENTIAL__/$turnCredential/g" packages/slidemachina/browser-runtime/remote-control/remote-transport.ts
          fi

      # Paths in the build are relative, so the site works under /slidemachina/.
      - name: Build the examples
        run: npx slidemachina build examples --folder --out "$RUNNER_TEMP/examples-site"

      # The phone page of the remote control lives at /slidemachina/remote.html; a QR code of any talk can point at it.
      - name: Build the remote page
        run: npx slidemachina remote-page --out "$RUNNER_TEMP/examples-site/remote.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/examples-site

      - id: deployment
        uses: actions/deploy-pages@v5
